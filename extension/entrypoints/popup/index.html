<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Dark Mode Enabler</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <img src="/icon/128.png" alt="" class="header__icon" />
      <div class="header__text">
        <h1 class="header__title">Dark Mode Enabler</h1>
        <p class="header__site" id="siteName"></p>
      </div>
    </header>

    <main class="body">
      <p class="notice" id="notice" role="status" hidden></p>

      <section class="section">
        <h2 class="section__label" id="modeLabel">Display mode</h2>
        <div class="modes" role="radiogroup" aria-labelledby="modeLabel">
          <label class="mode">
            <input type="radio" name="displayMode" value="DISABLED" checked />
            <span class="mode__face">
              <svg class="mode__icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M6 18 18 6" />
              </svg>
              <span class="mode__name">Off</span>
            </span>
          </label>

          <label class="mode">
            <input type="radio" name="displayMode" value="DARK" />
            <span class="mode__face">
              <svg class="mode__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
              </svg>
              <span class="mode__name">Dark</span>
            </span>
          </label>

          <label class="mode">
            <input type="radio" name="displayMode" value="SEPIA" />
            <span class="mode__face">
              <svg class="mode__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v18H6.5A2.5 2.5 0 0 0 4 18.5Z" />
                <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v18h4.5a2.5 2.5 0 0 1 2.5 2.5Z" />
              </svg>
              <span class="mode__name">Sepia</span>
            </span>
          </label>

          <label class="mode">
            <input type="radio" name="displayMode" value="GRAY_SCALE" />
            <span class="mode__face">
              <svg class="mode__icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 3v18a9 9 0 0 0 0-18Z" class="mode__icon-fill" />
              </svg>
              <span class="mode__name">Gray</span>
            </span>
          </label>
        </div>
      </section>

      <section class="section" id="appearanceSection">
        <div class="section__head">
          <h2 class="section__label">Appearance</h2>
          <button type="button" class="reset" id="resetAppearance" hidden>
            Reset
          </button>
        </div>
        <div class="sliders" id="sliders"></div>
        <p class="hint">Applies to every site.</p>
      </section>
    </main>

    <footer class="footer">
      <span
        >Developed by <span class="footer__handle">@codesandtags</span></span
      >
      <span id="versionNumber"></span>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
